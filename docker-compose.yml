services:
  postgres:
    image: postgres:16-alpine
    container_name: workless-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: workless
      POSTGRES_USER: workless
      POSTGRES_PASSWORD: workless_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workless"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: workless-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
