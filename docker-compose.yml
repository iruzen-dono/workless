services:
  postgres:
    image: postgres:16-alpine
    container_name: workless-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: workless
      POSTGRES_USER: workless
      POSTGRES_PASSWORD: workless_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workless"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: workless-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API (production)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: workless-backend
    ports:
      - "8000:9000"
    environment:
      APP_ENV: production
      APP_DEBUG: false
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: workless
      DB_USERNAME: workless
      DB_PASSWORD: workless_secret
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Queue worker
  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: workless-queue
    command: php artisan queue:work redis --sleep=3 --tries=3
    environment:
      APP_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
      DB_DATABASE: workless
      DB_USERNAME: workless
      DB_PASSWORD: workless_secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Scheduler
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: workless-scheduler
    command: php artisan schedule:work
    environment:
      APP_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Frontend (production)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: workless-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
